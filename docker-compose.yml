services:
  postgres:
    image: postgres:18.6
    container_name: heizsaison-postgres
    environment:
      POSTGRES_USER: heizsaison
      POSTGRES_PASSWORD: heizsaison
      POSTGRES_DB: heizsaison
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database-schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heizsaison -d heizsaison"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - heizsaison

  oil:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
        COMMIT: local
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: heizsaison-oil
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://heizsaison:heizsaison@postgres:5432/heizsaison?sslmode=disable"
      LOG_LEVEL: debug
      LOG_FORMAT: console
      HTTP_ADDR: ":8080"
      ZIP_CODE: "47259"
      ORDER_AMOUNT: "3000"
    ports:
      - "8080:8080"
    networks:
      - heizsaison
    restart: unless-stopped

  weather:
    build:
      context: .
      dockerfile: Dockerfile.weather
      args:
        VERSION: dev
        COMMIT: local
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: heizsaison-weather
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://heizsaison:heizsaison@postgres:5432/heizsaison?sslmode=disable"
      LOG_LEVEL: debug
      LOG_FORMAT: console
      HTTP_ADDR: ":8081"
      LATITUDE: "51.4556"
      LONGITUDE: "6.7623"
      PROVIDERS: "openmeteo"
    ports:
      - "8081:8081"
    networks:
      - heizsaison
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  heizsaison:
    driver: bridge
